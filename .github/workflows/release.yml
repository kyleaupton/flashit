name: Release

# Tag vX.Y.Z to release. The package workflows build and test each platform;
# this one publishes. Run by hand it is a dry run: everything but the publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the v
        type: string
        required: true
      signing:
        description: macOS signing for the dry run
        type: choice
        options: [adhoc, developer-id]
        default: adhoc

permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      signing: ${{ steps.version.outputs.signing }}
    steps:
      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SIGNING: ${{ inputs.signing }}
        run: |
          if [ "$EVENT" = push ]; then
            version=${TAG#v}
            signing=developer-id
          else
            version=$INPUT_VERSION
            signing=$INPUT_SIGNING
          fi
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "::error::version '$version' is not MAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          # A prerelease never becomes releases/latest, which is all the
          # updater reads.
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "signing=$signing"
          } >> "$GITHUB_OUTPUT"

  package-macos:
    needs: version
    uses: ./.github/workflows/package-macos.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}
      signing: ${{ needs.version.outputs.signing }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

  package-windows:
    needs: version
    uses: ./.github/workflows/package-windows.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}

  package-linux:
    needs: version
    uses: ./.github/workflows/package-linux.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [version, package-macos, package-windows, package-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      # One SHA256SUMS for everything, in place of package-linux's own. The
      # macOS updater checks its archive against this, so keep the plain
      # sha256sum format.
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
