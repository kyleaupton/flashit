name: Package Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v (default 0.0.0-dev.<run number>)
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        description: Package version without the v
        type: string
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  package:
    name: Package (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=${INPUT_VERSION:-0.0.0-dev.$GITHUB_RUN_NUMBER}
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "::error::version '$version' is not MAJOR.MINOR.PATCH[-PRERELEASE] without a v"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Exclude node_modules from Go
        run: echo "module node_modules" > frontend/node_modules/go.mod

      - name: Build helper
        run: task windows:build:helper

      - name: Build application
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: task windows:build VERSION="$VERSION"

      # No updater on Windows yet, but the binary carries the key all the same.
      - name: Check the updater key
        run: build/updater/check-release-binary.sh bin/FlashIt.exe

      - name: NSIS installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          wails3 generate webview2bootstrapper -dir build/windows/nsis
          $helperPath = "$env:GITHUB_WORKSPACE\bin\helpers\flashit-helper.exe"
          $appPath = "$env:GITHUB_WORKSPACE\bin\FlashIt.exe"
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -DARG_WAILS_AMD64_BINARY="$appPath" -DARG_HELPER_BINARY="$helperPath" build\windows\nsis\project.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item -Path bin\flashit-amd64-installer.exe -Destination "bin\flashit-$env:VERSION-windows-x64-installer.exe"

      - name: Zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Compress-Archive -Path bin\FlashIt.exe,bin\helpers\flashit-helper.exe -DestinationPath "bin\flashit-$env:VERSION-windows-x64.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            bin/flashit-*-windows-x64-installer.exe
            bin/flashit-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
