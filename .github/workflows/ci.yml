name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      # gofmt and the tests' fixtures want the files as committed, not
      # with CRLF line endings.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            dosfstools mtools

      # main.go embeds frontend/dist, which is gitignored, so the Go steps
      # below need it built first.
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # FLASHIT_MTOOLS runs the fatfmt round trip through mtools (Linux
      # only; the other legs skip it).
      - name: Test
        env:
          FLASHIT_MTOOLS: ${{ runner.os == 'Linux' && '1' || '' }}
        run: go test ./...

      # The macOS helper is cgo (Security for the authopen authorization,
      # DiskArbitration for the claim) and only compiles here; `go build
      # ./...` above covers it, this makes a break in it show up by name.
      - name: Build macOS helper
        if: runner.os == 'macOS'
        run: go build -o /dev/null ./cmd/flashit-helper

      # The Ubuntu leg builds the helper natively via `go build ./...`; this
      # keeps the linux-tagged files honest from the other host too.
      - name: Cross-build helper for Linux
        if: runner.os == 'macOS'
        run: |
          GOOS=linux go vet ./cmd/flashit-helper ./internal/helper/... ./internal/priv/...
          GOOS=linux go vet -tags production ./internal/priv/...
          GOOS=linux go build -o /dev/null ./cmd/flashit-helper

      - name: Cross-build for Windows
        if: runner.os == 'macOS'
        run: |
          GOOS=windows go vet ./...
          GOOS=windows go build -o /dev/null .

  # The Windows disk ops against a VHD the test creates and attaches, which
  # needs the administrator the runner runs as.
  windows-disk:
    name: Windows disk ops (VHD)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        env:
          FLASHIT_VHD_TEST: '1'
        run: go test -count=1 -v -run '^TestVHD$' ./internal/helper

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run type-check
        working-directory: frontend
