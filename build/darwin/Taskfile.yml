version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross
  APP_ID: dev.kyleupton.flashit
  HELPER_ID: dev.kyleupton.flashit.helper
  HELPER_PLIST: build/darwin/dev.kyleupton.flashit.helper.plist
  DEV_IDENTITY: "FlashIt Dev Code Signing"
  # Label and socket path: internal/proto DarwinHelperLabel, DarwinSocketPath.
  # The daemon accepts only clients signed as APP_ID with this exact leaf
  # certificate. Empty when the dev certificate has not been created; the
  # run task refuses to continue when more than one certificate matches.
  DEV_LEAF_SHA1:
    sh: security find-certificate -c "{{.DEV_IDENTITY}}" -Z 2>/dev/null | awk '/SHA-1/{print $3; exit}'
  DEV_CERT_COUNT:
    sh: security find-certificate -c "{{.DEV_IDENTITY}}" -a -Z 2>/dev/null | grep -c 'SHA-1' || true
  # Dev builds stamp app and helper with a hash of the helper's sources, so
  # the app re-registers the daemon exactly when the helper changed. The
  # app's stamp is priv.HelperVersion, set with -X below.
  HELPER_SRC_HASH:
    sh: find cmd/flashit-helper internal/helper internal/proto -type f -not -name '*_test.go' | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -c1-12
  DEV_HELPER_VERSION: 'dev-{{.HELPER_SRC_HASH}}'
  HELPER_VERSION_VAR: github.com/kyleaupton/flashit/internal/priv.HelperVersion

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
      # Dev builds expect the source-stamped helper; releases expect VERSION.
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or (eq .OBFUSCATED "true") .EXTRA_TAGS}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l" -ldflags="-X main.Version={{.VERSION}} -X {{.HELPER_VERSION_VAR}}={{.DEV_HELPER_VERSION}}"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -X main.Version={{.VERSION}} -X {{.HELPER_VERSION_VAR}}={{.VERSION}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=13.0"
      CGO_LDFLAGS: "-mmacosx-version-min=13.0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  build:helper:
    summary: Builds the privileged helper daemon with its client code requirement baked in
    cmds:
      - go build -trimpath -buildvcs=false -ldflags "-w -s -X main.Version={{.HELPER_VERSION}} -X main.AppIdentifier={{.APP_ID}} -X main.LeafSHA1={{.LEAF_SHA1}} -X main.TeamID={{.TEAM_ID}}" -o "{{.BIN_DIR}}/flashit-helper" ./cmd/flashit-helper
    vars:
      HELPER_VERSION: '{{.HELPER_VERSION}}'
      LEAF_SHA1: '{{.LEAF_SHA1}}'
      TEAM_ID: '{{.TEAM_ID}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=13.0"
      CGO_LDFLAGS: "-mmacosx-version-min=13.0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
    preconditions:
      - sh: '[ -n "$APPLE_SIGNING_IDENTITY" ]'
        msg: "APPLE_SIGNING_IDENTITY must be set: the helper is built to accept only apps signed by APPLE_TEAM_ID, and an ad-hoc signed bundle would be refused by its own daemon."
    cmds:
      - task: build:helper
        vars:
          HELPER_VERSION: '{{.VERSION | default "dev"}}'
          TEAM_ID: '{{.APPLE_TEAM_ID}}'
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    preconditions:
      - sh: '[ -n "$APPLE_SIGNING_IDENTITY" ]'
        msg: "APPLE_SIGNING_IDENTITY must be set: the helper is built to accept only apps signed by APPLE_TEAM_ID, and an ad-hoc signed bundle would be refused by its own daemon."
    cmds:
      - task: build:helper
        vars:
          HELPER_VERSION: '{{.VERSION | default "dev"}}'
          TEAM_ID: '{{.APPLE_TEAM_ID}}'
      - task: create:app:bundle

  generate:info:plist:
    summary: Generates Info.plist from template with version substitution
    preconditions:
      - sh: '[ -n "$APPLE_TEAM_ID" ]'
        msg: "APPLE_TEAM_ID environment variable must be set"
    cmds:
      - |
        sed -e 's/${APPLE_TEAM_ID}/'"$APPLE_TEAM_ID"'/g' \
            -e 's/${VERSION}/{{.VERSION | default "0.1.0"}}/g' \
            build/darwin/Info.plist.template > build/darwin/Info.plist

  create:app:bundle:
    summary: Creates an `.app` bundle
    deps:
      - task: generate:info:plist
    cmds:
      - task: assemble:bundle
        vars:
          APP: '{{.APP}}'
          INFO_PLIST: build/darwin/Info.plist
      # Sign in order: helper, then main binary, then bundle. The helper gets
      # the hardened runtime and nothing else; the app keeps its entitlements.
      - codesign --force --options runtime --identifier {{.HELPER_ID}} --sign "{{.SIGNING_IDENTITY}}" "{{.APP}}/Contents/MacOS/flashit-helper"
      - codesign --force --options runtime --entitlements build/darwin/entitlements.plist --sign "{{.SIGNING_IDENTITY}}" "{{.APP}}/Contents/MacOS/{{.APP_NAME}}"
      - codesign --force --options runtime --entitlements build/darwin/entitlements.plist --sign "{{.SIGNING_IDENTITY}}" "{{.APP}}"
    vars:
      APP: '{{.BIN_DIR}}/{{.APP_NAME}}.app'
      SIGNING_IDENTITY: '{{.APPLE_SIGNING_IDENTITY}}'

  assemble:bundle:
    summary: Lays out a bundle from bin/ (app, helper, launchd plist, icons)
    internal: true
    cmds:
      # Start clean: a file left over from an earlier layout would be sealed
      # into the signature.
      - rm -rf "{{.APP}}/Contents"
      - mkdir -p "{{.APP}}/Contents/MacOS" "{{.APP}}/Contents/Resources" "{{.APP}}/Contents/Library/LaunchDaemons"
      - cp build/darwin/icons.icns "{{.APP}}/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.APP}}/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.APP}}/Contents/MacOS/{{.APP_NAME}}"
      - cp "{{.BIN_DIR}}/flashit-helper" "{{.APP}}/Contents/MacOS/flashit-helper"
      - cp "{{.HELPER_PLIST}}" "{{.APP}}/Contents/Library/LaunchDaemons/"
      - cp "{{.INFO_PLIST}}" "{{.APP}}/Contents/Info.plist"

  run:
    summary: Builds the dev bundle with the helper inside, signs it and launches it
    preconditions:
      - sh: '[ "{{.DEV_CERT_COUNT}}" -le 1 ]'
        msg: "More than one certificate named '{{.DEV_IDENTITY}}' is in the keychain; the helper can only be built to trust one. Delete the extras in Keychain Access."
    cmds:
      - task: build:helper
        vars:
          HELPER_VERSION: '{{.DEV_HELPER_VERSION}}'
          LEAF_SHA1: '{{.DEV_LEAF_SHA1}}'
      - task: assemble:bundle
        vars:
          APP: '{{.APP}}'
          INFO_PLIST: build/darwin/Info.dev.plist
      - |
        if [ -n "{{.DEV_LEAF_SHA1}}" ]; then
          codesign --force --options runtime --timestamp=none --identifier {{.HELPER_ID}} --sign "{{.DEV_IDENTITY}}" "{{.APP}}/Contents/MacOS/flashit-helper"
          codesign --force --options runtime --timestamp=none --entitlements build/darwin/entitlements.plist --sign "{{.DEV_IDENTITY}}" "{{.APP}}/Contents/MacOS/{{.APP_NAME}}"
          codesign --force --options runtime --timestamp=none --entitlements build/darwin/entitlements.plist --sign "{{.DEV_IDENTITY}}" "{{.APP}}"
        else
          echo "WARNING: certificate '{{.DEV_IDENTITY}}' not found in the keychain; signing ad hoc." >&2
          echo "         The helper daemon will refuse this app. See DEV_SETUP.md to create the certificate." >&2
          codesign --force --deep --sign - "{{.APP}}"
        fi
      - '"{{.APP}}/Contents/MacOS/{{.APP_NAME}}"'
    vars:
      APP: '{{.BIN_DIR}}/{{.APP_NAME}}.dev.app'
