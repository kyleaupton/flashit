# Built by `task linux:package`, which sets VERSION and GOARCH and runs nfpm
# from the repository root. Package names are checked against Ubuntu 24.04,
# Debian 13 and Fedora 40+.
name: flashit
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Kyle Upton <kyleaupton@gmail.com>
description: |-
  Write bootable USB installers from ISO images
  FlashIt writes Linux ISOs raw to a USB drive and turns Windows ISOs into a
  FAT32 installer, splitting install.wim when it exceeds 4 GB.
vendor: Kyle Upton
homepage: https://github.com/kyleaupton/flashit
license: GPL-3.0

contents:
  - src: ./bin/FlashIt
    dst: /usr/bin/flashit
    file_info:
      mode: 0755

  # rpm only removes a directory it owns, so claim it.
  - dst: /usr/libexec/flashit
    type: dir
    file_info:
      mode: 0755
  # pkexec runs this as root; the packaged app refuses to spawn it unless it
  # and every directory above it are root's alone.
  - src: ./bin/helpers/flashit-helper
    dst: /usr/libexec/flashit/flashit-helper
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: ./build/linux/polkit/dev.kyleupton.flashit.policy
    dst: /usr/share/polkit-1/actions/dev.kyleupton.flashit.policy
    file_info:
      mode: 0644
  - src: ./build/linux/dev.kyleupton.flashit.desktop
    dst: /usr/share/applications/dev.kyleupton.flashit.desktop
    file_info:
      mode: 0644

  - src: ./build/linux/icons/16x16.png
    dst: /usr/share/icons/hicolor/16x16/apps/flashit.png
    file_info: {mode: 0644}
  - src: ./build/linux/icons/24x24.png
    dst: /usr/share/icons/hicolor/24x24/apps/flashit.png
    file_info: {mode: 0644}
  - src: ./build/linux/icons/32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/flashit.png
    file_info: {mode: 0644}
  - src: ./build/linux/icons/48x48.png
    dst: /usr/share/icons/hicolor/48x48/apps/flashit.png
    file_info: {mode: 0644}
  - src: ./build/linux/icons/64x64.png
    dst: /usr/share/icons/hicolor/64x64/apps/flashit.png
    file_info: {mode: 0644}
  - src: ./build/linux/icons/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/flashit.png
    file_info: {mode: 0644}
  - src: ./build/linux/icons/256x256.png
    dst: /usr/share/icons/hicolor/256x256/apps/flashit.png
    file_info: {mode: 0644}
  - src: ./build/linux/icons/512x512.png
    dst: /usr/share/icons/hicolor/512x512/apps/flashit.png
    file_info: {mode: 0644}

# lsblk (app) and partprobe, parted, mkfs.vfat, udevadm (helper). eject is
# optional: the helper skips it when missing.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - pkexec
  - polkitd
  - parted
  - dosfstools
  - udev
  - util-linux

overrides:
  deb:
    recommends:
      - eject
  rpm:
    # Fedora ships pkexec in polkit and eject in util-linux.
    depends:
      - gtk4
      - webkitgtk6.0
      - polkit
      - parted
      - dosfstools
      - systemd-udev
      - util-linux

scripts:
  postinstall: ./build/linux/nfpm/scripts/refresh.sh
  postremove: ./build/linux/nfpm/scripts/refresh.sh
